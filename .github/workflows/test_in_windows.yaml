name: Python Selenium Tests - Windows

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Selenium Tests
    runs-on: windows-latest

    outputs:
      has_allure: ${{ steps.check_allure.outputs.has_allure }}
      has_testresults: ${{ steps.check_results.outputs.has_results }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: |
          python --version
          pip --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Validate Python Syntax
        run: |
          python -m compileall .
          python -m mypy .

      - name: Create Report Directories
        run: |
          mkdir Reports
          mkdir Screenshots
        shell: cmd

      - name: Execute Tests
        run: |
          python -m pytest --alluredir=allure-results
        # continue-on-error: true

      - name: Check Allure Results
        id: check_allure
        shell: pwsh
        run: |
          if ((Test-Path "allure-results") -and ((Get-ChildItem allure-results -Recurse -File).Count -gt 0)) {
            "has_allure=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "has_allure=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check Test Results
        id: check_results
        shell: pwsh
        run: |
          if ((Test-Path "TestResults") -and ((Get-ChildItem TestResults -Recurse -File).Count -gt 0)) {
            "has_results=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "has_results=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/

  allure:
    needs: test
    if: needs.test.outputs.has_allure == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    outputs:
      report_generated: true

    steps:

      - uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    needs: allure
    if: |
      needs.test.outputs.has_allure == 'true' &&
      needs.allure.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4