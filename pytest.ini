[pytest]
; pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
          -v
        ;   -s
          -n 2

log_cli = true
log_cli_level = INFO

strict_markers = true
markers = 
        smoke: execute testcases marked as smoke
        regression: execute testcases marked as regression